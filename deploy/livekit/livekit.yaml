# ============================================================
#  إعدادات خادم LiveKit — الإنتاج
#  المفاتيح لا تُكتب هنا: تُمرَّر عبر متغير البيئة LIVEKIT_KEYS
#  من ملف .env (انظر docker-compose.yml).
# ============================================================

# منفذ الإشارات (HTTP/WebSocket) — Caddy يحوّل إليه wss://
port: 7880

# شبكة الوسائط الحقيقية (WebRTC)
rtc:
  # TCP الاحتياطي عند حجب UDP
  tcp_port: 7881
  # مدى منافذ UDP للوسائط — افتحها في جدار الحماية
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 60000
  # يكتشف IP الخارجي تلقائياً — ضروري على VPS
  use_external_ip: true
  # ضغط وتكييف البث حسب سرعة كل مشارك (توفير بيانات وبطارية)
  congestion_control: dynamic_buffer

# Redis لإدارة حالة الغرف والمشاركين بشكل مستقر
redis:
  address: 127.0.0.1:6379

# الغرفة الفارغة تُحذف بعد دقيقتين لتوفير الموارد
room:
  empty_timeout: 120
  # حد أقصى لعدد المشاركين في القاعة الواحدة (اشتراطات المشروع)
  max_participants: 50

# مستوى السجلات: info في الإنتاج (debug فقط للتشخيص)
logging:
  level: info

# ===== اختياري: TURN عبر TLS للمشاركين خلف جدران حماية صارمة =====
# فعّله فقط إذا أبلغك التطبيق عن فشل اتصال لدى بعض الشبكات:
# turn:
#   enabled: true
#   domain: ${LIVEKIT_DOMAIN}
#   tls_port: 5349
